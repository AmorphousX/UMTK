name: Package / Release UMTK UI

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build Windows zip"
        type: boolean
        default: true
      build_macos_intel:
        description: "Build macOS Intel (x86_64) zip"
        type: boolean
        default: true
      build_macos_arm:
        description: "Build macOS Apple Silicon (arm64) zip"
        type: boolean
        default: true
      build_ubuntu_deb:
        description: "Build Ubuntu .deb"
        type: boolean
        default: true
      build_linux_tar:
        description: "Build Linux tar.gz of source files"
        type: boolean
        default: true
      generate_release:
        description: "Generate A release for this build?"
        type: boolean
        default: false
      tag:
        description: "Tag name for the release (leave blank to auto-generate)"
        type: string
        required: false
      release_name:
        description: "Release name (defaults to tag)"
        type: string
        required: false
      prerelease:
        description: "Mark release as pre-release"
        type: boolean
        default: false

jobs:
  build_windows:
    if: ${{ inputs.build_windows == true }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: UMTK_UI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with PyInstaller
        shell: cmd
        run: |
          python -m venv gui_venv
          call gui_venv\Scripts\activate
          pip install pyinstaller
          pip install -r requirements.txt
          pyinstaller pyinstall.spec

      - name: Package zip
        shell: pwsh
        run: |
          cd ./dist
          Compress-Archive -Path * -DestinationPath ../umtk-ui-windows.zip

      - name: Upload artifact (Windows zip)
        uses: actions/upload-artifact@v4
        with:
          name: umtk-ui-windows
          path: UMTK_UI/umtk-ui-windows.zip

  build_macos_intel:
    if: ${{ inputs.build_macos_intel == true }}
    runs-on: macos-13
    defaults:
      run:
        working-directory: UMTK_UI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with PyInstaller
        run: |
          python3 -m venv gui_venv
          source gui_venv/bin/activate
          pip install pyinstaller
          pip install -r requirements.txt
          pyinstaller pyinstall.spec

      - name: Package zip
        run: |
          cd ./dist
          zip -r ./umtk-ui-macos-intel.zip .

      - name: Upload artifact (macOS Intel zip)
        uses: actions/upload-artifact@v4
        with:
          name: umtk-ui-macos-intel
          path: UMTK_UI/umtk-ui-macos-intel.zip

  build_macos_arm:
    if: ${{ inputs.build_macos_arm == true }}
    runs-on: macos-latest  # Apple Silicon runner
    defaults:
      run:
        working-directory: UMTK_UI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with PyInstaller
        run: |
          python3 -m venv gui_venv
          source gui_venv/bin/activate
          pip install pyinstaller
          pip install -r requirements.txt
          pyinstaller pyinstall.spec

      - name: Package zip
        run: |
          cd ./dist
          zip -r ./umtk-ui-macos-arm64.zip .

      - name: Upload artifact (macOS Apple Silicon zip)
        uses: actions/upload-artifact@v4
        with:
          name: umtk-ui-macos-arm64
          path: UMTK_UI/umtk-ui-macos-arm64.zip

  build_ubuntu_deb:
    if: ${{ inputs.build_ubuntu_deb == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UMTK_UI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with PyInstaller
        run: |
          python3 -m venv gui_venv
          source gui_venv/bin/activate
          pip install pyinstaller
          pip install -r requirements.txt
          pyinstaller pyinstall.spec

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Build .deb
        run: |
          mkdir -p deb-root/usr/local/umtk-ui
          cp -r dist/* deb-root/usr/local/umtk-ui/
          fpm -s dir -t deb -n umtk-ui -v 1.0.0 --prefix=/usr/local/umtk-ui -C deb-root .

      - name: Upload artifact (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: umtk-ui-ubuntu-deb
          path: UMTK_UI/*.deb

  build_linux_tar:
    if: ${{ inputs.build_linux_tar == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UMTK_UI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source tar.gz
        run: |
          mkdir -p build-tar
          cp main.py requirements.txt *.ui build-tar/ || true
          cp -r img style lib build-tar/
          # Copy install scripts but exclude any venv directories  
          cp package/script/linux/*.sh build-tar/
          tar czf umtk-ui-linux.tar.gz -C build-tar .

      - name: Upload artifact (Linux tar)
        uses: actions/upload-artifact@v4
        with:
          name: umtk-ui-linux-tar
          path: UMTK_UI/umtk-ui-linux.tar.gz

  release:
    name: Create GitHub Release and upload assets
    runs-on: ubuntu-latest
    needs: [build_windows, build_macos_intel, build_macos_arm, build_ubuntu_deb, build_linux_tar]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Compute tag and name
        id: meta
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          BRANCH_NAME="${GITHUB_REF_NAME}"
          # Tag: user input overrides, else short hash
            if [ -n "${{ inputs.tag }}" ]; then
              echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
            else
              echo "tag=${GIT_HASH}" >> $GITHUB_OUTPUT
            fi
          # Release name: user input overrides, else branch name
            if [ -n "${{ inputs.release_name }}" ]; then
              echo "name=${{ inputs.release_name }}" >> $GITHUB_OUTPUT
            else
              echo "name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
            fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: ${{ inputs.generate_release == true }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}